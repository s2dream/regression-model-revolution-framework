data:
  data_dir: data
  feature_columns: null
  ignored_columns: null
  output_dir: outputs
  split:
    method: train_test_split
    n_splits: 5
    shuffle: true
    test_size: 0.2
    val_size: null
  target_column: Target_Y
framework:
  active_models:
  - XGBoost
  - MLP
  - TabPFN
  - RandomForest
  - CatBoost
  random_state: 42
  test_size: 0.2
logging:
  console_level: INFO
  log_dir: logs
models:
  CatBoost:
    depth: 6
    iterations: 100
    learning_rate: 0.1
    verbose: 0
  MLP:
    activation: relu
    hidden_layer_sizes:
    - 128
    - 64
    max_iter: 500
    solver: adam
  RandomForest:
    max_depth: null
    n_estimators: 100
    n_jobs: -1
  TabPFN:
    N_ensemble_configurations: 32
  XGBoost:
    learning_rate: 0.1
    max_depth: 6
    n_estimators: 100
    n_jobs: -1
